<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart & Romantic Album (MacBook Pro 2015 Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #020005;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #webgl-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* Minimal Bottom Dock (Gọn gàng, tối ưu hiệu năng) */
        .bottom-dock {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px; z-index: 20;
            background: rgba(18, 4, 22, 0.8);
            backdrop-filter: blur(12px);
            padding: 6px 16px; border-radius: 40px;
            border: 1px solid rgba(255, 105, 180, 0.35);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
        }
        .btn {
            background: linear-gradient(135deg, #ff2a70 0%, #ba1254 100%);
            border: none; color: #fff; padding: 6px 14px; border-radius: 30px;
            font-family: 'Quicksand', sans-serif; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 5px;
            box-shadow: 0 3px 10px rgba(255, 42, 112, 0.4);
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(255, 42, 112, 0.6); }
        .btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn.secondary:hover { background: rgba(255, 255, 255, 0.22); }

        /* Quick count picker */
        .count-picker {
            display: inline-flex; align-items: center; gap: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 2px 6px;
            border: 1px solid rgba(255, 105, 180, 0.25);
        }
        .count-picker span { font-size: 0.7rem; color: #f9a8d4; margin-right: 2px; }
        .cnt-btn {
            background: transparent; border: none; color: #ffb8da;
            width: 20px; height: 20px; border-radius: 50%;
            cursor: pointer; font-size: 0.72rem; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .cnt-btn.active, .cnt-btn:hover {
            background: #ff2a70; color: #fff;
            box-shadow: 0 0 8px #ff2a70;
        }

        /* Compact Webcam HUD góc dưới phải */
        .webcam-hud {
            position: fixed; bottom: 18px; right: 18px;
            width: 110px; height: 82px; z-index: 20;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 2px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        .webcam-hud video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hud-status {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 0, 15, 0.9); font-size: 0.62rem; color: #ff94c2;
            text-align: center; padding: 2px 2px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; font-weight: 600;
        }

        /* Status Badge nhỏ gọn góc trên */
        .status-badge {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none;
            background: rgba(20, 5, 25, 0.65); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 105, 180, 0.3); border-radius: 20px;
            padding: 4px 14px; font-size: 0.78rem; color: #fce7f3;
            box-shadow: 0 0 12px rgba(255, 42, 112, 0.3);
        }

        /* =============================================================
           "ANH YÊU EM" TOÀN MÀN HÌNH - KHÔNG BỊ CHE, KHÔNG NÚT THỪA
        ============================================================= */
        .love-confession-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(35, 2, 25, 0.92) 0%, rgba(8, 0, 12, 0.98) 100%);
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease;
            cursor: pointer;
        }
        .love-confession-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .love-card-center {
            text-align: center; padding: 25px;
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }
        .love-confession-overlay.active .love-card-center {
            transform: scale(1);
        }
        .love-neon-title {
            font-family: 'Great Vibes', 'Dancing Script', cursive;
            font-size: 5.5rem; line-height: 1.15;
            color: #ffffff;
            text-shadow: 
                0 0 10px #ff69b4,
                0 0 25px #ff1493,
                0 0 50px #ff007f,
                0 0 80px #ff0055,
                0 0 120px #ff0055;
            margin-bottom: 15px;
            animation: pulseNeonTitle 2.5s infinite ease-in-out;
        }
        @keyframes pulseNeonTitle {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 10px #ff69b4, 0 0 25px #ff1493, 0 0 50px #ff007f, 0 0 80px #ff0055;
            }
            50% {
                transform: scale(1.03);
                text-shadow: 0 0 15px #fff, 0 0 35px #ff69b4, 0 0 65px #ff1493, 0 0 95px #ff0055;
            }
        }
        .love-neon-sub {
            font-size: 1.3rem; color: #ffe4f3;
            letter-spacing: 4px; text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255, 105, 180, 0.9);
            margin-bottom: 20px;
        }
        .love-click-hint {
            display: inline-block;
            font-size: 0.85rem; color: #f9a8d4;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 30px; padding: 6px 20px;
            letter-spacing: 1px;
        }

        /* Pháo hoa tim bay lượn */
        .sparkle-heart {
            position: fixed; pointer-events: none; z-index: 1000000;
            animation: flyUpAndFade 2.2s ease-out forwards;
        }
        @keyframes flyUpAndFade {
            0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        #photoMultiInput, #audioInput { display: none; }

        @media (max-width: 768px) {
            .love-neon-title { font-size: 3.5rem; }
            .bottom-dock { padding: 5px 10px; gap: 5px; bottom: 10px; }
            .btn { padding: 5px 8px; font-size: 0.7rem; }
            .webcam-hud { width: 90px; height: 68px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="status-badge" id="statusBadge">
        ✊ Trái Tim 3D (Xòe tay để bung ảnh)
    </div>

    <div class="bottom-dock">
        <button class="btn" onclick="document.getElementById('photoMultiInput').click()">
            <i class="fa-solid fa-images"></i> Thay Ảnh
        </button>

        <div class="count-picker">
            <span>Số ảnh:</span>
            <button class="cnt-btn" onclick="setPhotoCount(1)">1</button>
            <button class="cnt-btn" onclick="setPhotoCount(2)">2</button>
            <button class="cnt-btn" onclick="setPhotoCount(3)">3</button>
            <button class="cnt-btn" onclick="setPhotoCount(4)">4</button>
            <button class="cnt-btn active" onclick="setPhotoCount(5)">5</button>
        </div>

        <button class="btn secondary" id="musicBtn" onclick="toggleMusic()">
            <i class="fa-solid fa-music"></i> <span id="musicText">Bật Nhạc</span>
        </button>
        <button class="btn secondary" onclick="document.getElementById('audioInput').click()">
            <i class="fa-solid fa-file-audio"></i> MP3
        </button>
        <button class="btn secondary" onclick="toggleBungMode()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="bungBtnText">Bung Tim</span>
        </button>
        <button class="btn secondary" onclick="triggerLoveConfession()">
            <i class="fa-solid fa-heart" style="color:#ff2a70;"></i> Tỏ Tình
        </button>
    </div>

    <div class="webcam-hud">
        <video id="webcamVideo" playsinline autoplay muted></video>
        <div class="hud-status" id="hudStatus">Khởi động camera...</div>
    </div>

    <!-- "ANH YÊU EM" Fullscreen Overlay -->
    <div class="love-confession-overlay" id="loveModal" onclick="closeLoveModal()">
        <div class="love-card-center">
            <h1 class="love-neon-title" id="loveMainText" onclick="event.stopPropagation(); editLoveText();">
                Anh Yêu Em ❤️
            </h1>
            <p class="love-neon-sub" id="loveSubText">
                Mãi Mãi Một Tình Yêu • Hạnh Phúc Trọn Đời
            </p>
            <div class="love-click-hint">
                <i class="fa-solid fa-heart" style="color:#ff2a70; margin-right:6px;"></i>
                Chạm vào màn hình để tiếp tục ngắm ảnh
            </div>
        </div>
    </div>

    <input type="file" id="photoMultiInput" accept="image/*" multiple>
    <input type="file" id="audioInput" accept="audio/*">
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-moment-2964.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* -------------------------------------------------------------
           1. CẤU HÌNH TỐI ƯU HÓA ĐẶC BIỆT CHO MACBOOK PRO 2015
           - Khóa PixelRatio = 1.0 (Tránh quá tải màn Retina 2.5K/2.8K)
           - Giảm số hạt xuống 1800 hạt phát sáng (Nhẹ hơn 75% GPU/CPU)
           - Giảm tải MediaPipe xuống ~15 FPS (Giảm 70% tải CPU Haswell/Broadwell)
        ------------------------------------------------------------- */
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3D.position.z = 88;

        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: false, // Tắt antialias để GPU Intel Iris chạy siêu nhẹ
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // KHÓA CỨNG 1.0 để Mac Retina không phải render 4 triệu điểm ảnh
        renderer.setPixelRatio(1.0);

        function createGlowSprite() {
            const c = document.createElement('canvas');
            c.width = 48; c.height = 48;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(24, 24, 0, 24, 24, 24);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 105, 180, 0.85)');
            grad.addColorStop(0.7, 'rgba(255, 20, 147, 0.25)');
            grad.addColorStop(1, 'rgba(255, 0, 100, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 48, 48);
            return new THREE.CanvasTexture(c);
        }

        // 1800 hạt: Rực rỡ nhưng nhẹ gấp 3 lần bản 7000 hạt
        const PARTICLE_COUNT = 1800;
        const heartPositions = new Float32Array(PARTICLE_COUNT * 3);
        const galaxyPositions = new Float32Array(PARTICLE_COUNT * 3);
        const currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const t = Math.PI * 2 * Math.random();
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 14 * Math.sin(t);
            const scale = 2.15 + (Math.random() - 0.5) * 0.4;

            heartPositions[i * 3] = x * scale;
            heartPositions[i * 3 + 1] = y * scale;
            heartPositions[i * 3 + 2] = z * scale;

            const radius = Math.random() * 92 + 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI * 0.85;
            galaxyPositions[i * 3] = radius * Math.cos(theta) * Math.cos(phi);
            galaxyPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.cos(phi);
            galaxyPositions[i * 3 + 2] = radius * Math.sin(phi);

            // MẶC ĐỊNH: BẮT ĐẦU Ở TRÁI TIM CHƯA BUNG
            currentPositions[i * 3] = heartPositions[i * 3];
            currentPositions[i * 3 + 1] = heartPositions[i * 3 + 1];
            currentPositions[i * 3 + 2] = heartPositions[i * 3 + 2];

            const cRatio = Math.random();
            colors[i * 3] = 1.0;
            colors[i * 3 + 1] = 0.2 + cRatio * 0.45;
            colors[i * 3 + 2] = 0.55 + cRatio * 0.45;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 2.6,
            map: createGlowSprite(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            depthTest: false
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        /* -------------------------------------------------------------
           2. 3D 1-5 PHOTO SYSTEM
        ------------------------------------------------------------- */
        const defaultPhotos = [
            "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80",
            "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=500&q=80",
            "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=500&q=80",
            "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=500&q=80",
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80"
        ];

        let activePhotos = [...defaultPhotos];
        let currentPhotoCount = 5;

        // Mặc định: Chưa bung (isBung = false)
        let isBung = false;
        let isZoomed = false;
        let currentPhotoIndex = 0;
        let smoothCarouselPos = 0.0;

        const photosGroup = new THREE.Group();
        scene.add(photosGroup);

        let photoMeshes = [];
        const sharedGeo = new THREE.PlaneGeometry(16, 20);

        function drawRomanticFallback(ctx, index) {
            const gradients = [
                ['#ff5858', '#f09819'],
                ['#ee0979', '#ff6a00'],
                ['#7f00ff', '#e100ff'],
                ['#fa709a', '#fee140'],
                ['#f857a6', '#ff5858']
            ];
            const g = gradients[index % gradients.length];
            const grad = ctx.createLinearGradient(12, 12, 308, 368);
            grad.addColorStop(0, g[0]);
            grad.addColorStop(1, g[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(12, 12, 296, 310);

            ctx.font = '55px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const icons = ['❤️', '💖', '🌹', '💕', '🥰'];
            ctx.fillText(icons[index % icons.length], 160, 150);

            ctx.font = 'bold 18px "Quicksand", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`Kỷ Niệm Tình Yêu ${index + 1}`, 160, 215);
        }

        function createCardTexture(imageSrc, index, callback) {
            // Tối ưu kích thước texture xuống 320x384 (Tiết kiệm VRAM)
            const c = document.createElement('canvas');
            c.width = 320; c.height = 384;
            const ctx = c.getContext('2d');

            function finishCard() {
                ctx.strokeStyle = '#ff69b4';
                ctx.lineWidth = 5;
                ctx.stroke();

                ctx.font = 'bold 20px "Dancing Script", cursive';
                ctx.fillStyle = '#ff2a70';
                ctx.textAlign = 'center';
                ctx.fillText(`Love Story ❤️ Ảnh ${index + 1}`, 160, 355);

                const texture = new THREE.CanvasTexture(c);
                texture.generateMipmaps = false;
                texture.minFilter = THREE.LinearFilter;
                callback(texture);
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(6, 6, 308, 372, 14);
            else ctx.rect(6, 6, 308, 372);
            ctx.fill();

            const img = new Image();
            img.crossOrigin = 'anonymous';

            let loaded = false;
            img.onload = () => {
                if (loaded) return;
                loaded = true;
                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(14, 14, 292, 305, 10);
                else ctx.rect(14, 14, 292, 305);
                ctx.clip();

                const hRatio = 292 / img.width;
                const vRatio = 305 / img.height;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = 14 + (292 - img.width * ratio) / 2;
                const centerShift_y = 14 + (305 - img.height * ratio) / 2;
                ctx.drawImage(img, centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
                ctx.restore();

                finishCard();
            };

            img.onerror = () => {
                if (loaded) return;
                loaded = true;
                drawRomanticFallback(ctx, index);
                finishCard();
            };

            setTimeout(() => {
                if (!loaded) {
                    loaded = true;
                    drawRomanticFallback(ctx, index);
                    finishCard();
                }
            }, 2500);

            img.src = imageSrc;
        }

        function buildPhotoMeshes() {
            while (photosGroup.children.length > 0) {
                const child = photosGroup.children[0];
                if (child.material) {
                    if (child.material.map) child.material.map.dispose();
                    child.material.dispose();
                }
                photosGroup.remove(child);
            }
            photoMeshes = [];

            const count = currentPhotoCount;
            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(sharedGeo, mat);
                mesh.scale.set(0, 0, 0);
                mesh.userData = { index: i };

                mesh.callback = () => {
                    currentPhotoIndex = i;
                    isZoomed = true;
                    isBung = true;
                    updateStatusBadge(`☝️ Đang zoom ảnh ${i + 1}/${count} (Đưa tay để đổi ảnh)`);
                    playChimeSound();
                };

                photosGroup.add(mesh);
                photoMeshes.push(mesh);

                const src = activePhotos[i % activePhotos.length];
                createCardTexture(src, i, (tex) => {
                    mat.map = tex;
                    mat.needsUpdate = true;
                });
            }
        }

        buildPhotoMeshes();

        document.getElementById('photoMultiInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files).slice(0, 5);
            if (files.length > 0) {
                activePhotos = files.map(file => URL.createObjectURL(file));
                currentPhotoCount = files.length;
                currentPhotoIndex = 0;
                smoothCarouselPos = 0;
                updateCountButtonsUI(currentPhotoCount);
                buildPhotoMeshes();
                updateStatusBadge(`Đã nạp ${files.length} ảnh của bạn ❤️ (Xòe tay để xem)`);
            }
        });

        function setPhotoCount(cnt) {
            currentPhotoCount = Math.min(Math.max(1, cnt), 5);
            currentPhotoIndex = Math.min(currentPhotoIndex, currentPhotoCount - 1);
            updateCountButtonsUI(currentPhotoCount);
            buildPhotoMeshes();
            updateStatusBadge(`Đang chọn hiển thị ${currentPhotoCount} ảnh`);
        }

        function updateCountButtonsUI(cnt) {
            document.querySelectorAll('.cnt-btn').forEach((b, idx) => {
                b.classList.toggle('active', (idx + 1) === cnt);
            });
        }

        function updateStatusBadge(text) {
            const b = document.getElementById('statusBadge');
            b.innerText = text;
        }

        function toggleBungMode() {
            if (!isBung) {
                isBung = true;
                isZoomed = false;
                document.getElementById('bungBtnText').innerText = "Gom Tim";
                updateStatusBadge(`🖐️ Trái tim bung & ${currentPhotoCount} ảnh xoay theo tay`);
            } else {
                isBung = false;
                isZoomed = false;
                document.getElementById('bungBtnText').innerText = "Bung Tim";
                updateStatusBadge("✊ Trái Tim 3D (Xòe tay để bung ảnh)");
            }
        }

        /* -------------------------------------------------------------
           3. AUDIO & TỎ TÌNH
        ------------------------------------------------------------- */
        const bgMusic = document.getElementById('bgMusic');
        const musicText = document.getElementById('musicText');
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => musicText.innerText = "Tắt Nhạc").catch(() => {});
            } else {
                bgMusic.pause();
                musicText.innerText = "Bật Nhạc";
            }
        }
        document.getElementById('audioInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                bgMusic.src = URL.createObjectURL(e.target.files[0]);
                bgMusic.play();
                musicText.innerText = "Tắt Nhạc";
            }
        });

        function editLoveText() {
            const val = prompt("Nhập lời tỏ tình / yêu thương:", document.getElementById('loveMainText').innerText);
            if (val) document.getElementById('loveMainText').innerText = val;
        }

        let audioCtx = null;
        function playChimeSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + idx * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.07 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.07);
                    osc.stop(audioCtx.currentTime + idx * 0.07 + 0.5);
                });
            } catch (err) {}
        }

        function triggerLoveConfession() {
            document.getElementById('loveModal').classList.add('active');
            playChimeSound();
            spawnHeartsExplosion();
        }

        function closeLoveModal() {
            document.getElementById('loveModal').classList.remove('active');
        }

        function spawnHeartsExplosion() {
            const emojis = ['💖', '💕', '❤️', '✨', '🌹', '🥰', '💘'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'sparkle-heart';
                    h.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    h.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 280) + 'px';
                    h.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 140) + 'px';
                    h.style.fontSize = (Math.random() * 26 + 18) + 'px';
                    h.style.setProperty('--tx', `${(Math.random() - 0.5) * 600}px`);
                    h.style.setProperty('--ty', `${-Math.random() * 500 - 120}px`);
                    h.style.setProperty('--rot', `${(Math.random() - 0.5) * 120}deg`);
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 2200);
                }, i * 35);
            }
        }

        /* -------------------------------------------------------------
           4. RENDER LOOP (MƯỢT MÀ 60 FPS, TIẾT KIỆM TỐI ĐA PIN & CPU)
        ------------------------------------------------------------- */
        let targetRotX = 0, targetRotY = 0;
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const positions = particleGeometry.attributes.position.array;
            const targetShapePos = isBung ? galaxyPositions : heartPositions;

            const beatScale = !isBung ? (1 + 0.06 * Math.sin(elapsedTime * 6) + 0.03 * Math.sin(elapsedTime * 12)) : 1;

            const len = PARTICLE_COUNT * 3;
            for (let i = 0; i < len; i += 3) {
                positions[i] += (targetShapePos[i] * beatScale - positions[i]) * 0.065;
                positions[i + 1] += (targetShapePos[i + 1] * beatScale - positions[i + 1]) * 0.065;
                positions[i + 2] += (targetShapePos[i + 2] * beatScale - positions[i + 2]) * 0.065;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            particleSystem.rotation.x += (targetRotX - particleSystem.rotation.x) * 0.05;
            particleSystem.rotation.y += (targetRotY - particleSystem.rotation.y) * 0.05 + 0.0015;

            if (isZoomed) {
                photosGroup.rotation.x += (targetRotX * 0.12 - photosGroup.rotation.x) * 0.08;
                photosGroup.rotation.y += (targetRotY * 0.12 - photosGroup.rotation.y) * 0.08;
                smoothCarouselPos += (currentPhotoIndex - smoothCarouselPos) * 0.12;
            } else {
                photosGroup.rotation.x = particleSystem.rotation.x;
                photosGroup.rotation.y = particleSystem.rotation.y;
            }

            const count = photoMeshes.length;

            photoMeshes.forEach((mesh, i) => {
                let tx = 0, ty = 0, tz = 0, trotY = 0, ts = 1, topa = 1;

                if (!isBung) {
                    // MẶC ĐỊNH CHƯA BUNG: ẢNH GIẤU HOÀN TOÀN Ở TÂM, SCALE = 0
                    tx = 0; ty = 0; tz = 0; trotY = 0; ts = 0; topa = 0;
                } 
                else if (isZoomed) {
                    // KHI ZOOM (1 NGÓN TAY): ẢNH DI CHUYỂN PHÓNG TO GIỮA MÀN HÌNH
                    const rel = i - smoothCarouselPos;
                    tx = rel * 34;
                    tz = 44 - Math.min(Math.abs(rel), 3.0) * 22;
                    ty = -Math.pow(rel, 2) * 1.0;
                    trotY = -Math.tanh(rel) * 0.55;
                    ts = Math.max(0.35, 1.68 - Math.abs(rel) * 0.52);
                    topa = Math.max(0.18, 1.0 - Math.abs(rel) * 0.42);
                } 
                else {
                    // KHI BUNG TRÁI TIM: BỐ CỤC NHƯ CŨ (TẤT CẢ ẢNH NẰM TRONG VÒNG QUỸ ĐẠO, KHÔNG DI CHUYỂN)
                    if (count === 1) {
                        tx = 0; ty = 0; tz = 8; ts = 1.15; trotY = 0; topa = 1;
                    } else if (count === 2) {
                        tx = (i === 0 ? -24 : 24); ty = 0; tz = 4;
                        ts = 0.95; trotY = (i === 0 ? 0.25 : -0.25); topa = 1;
                    } else if (count === 3) {
                        const angle = (i * (Math.PI * 2) / 3) - Math.PI / 2;
                        tx = Math.cos(angle) * 32; ty = Math.sin(angle) * 22; tz = 0;
                        ts = 0.85; trotY = Math.atan2(Math.cos(angle), 3) * 0.5; topa = 1;
                    } else if (count === 4) {
                        const angles = [-Math.PI * 0.75, -Math.PI * 0.25, Math.PI * 0.25, Math.PI * 0.75];
                        const a = angles[i];
                        tx = Math.cos(a) * 36; ty = Math.sin(a) * 24; tz = (i % 2 === 0 ? 5 : -5);
                        ts = 0.82; trotY = Math.cos(a) * 0.3; topa = 1;
                    } else {
                        const angle = (i * (Math.PI * 2) / 5) - Math.PI / 2;
                        tx = Math.cos(angle) * 38; ty = Math.sin(angle) * 26; tz = Math.sin(i * 2) * 5;
                        ts = 0.82; trotY = Math.cos(angle) * 0.35; topa = 1;
                    }
                    ty += Math.sin(elapsedTime * 2 + i) * 0.4;
                }

                mesh.position.x += (tx - mesh.position.x) * 0.1;
                mesh.position.y += (ty - mesh.position.y) * 0.1;
                mesh.position.z += (tz - mesh.position.z) * 0.1;

                const curS = mesh.scale.x + (ts - mesh.scale.x) * 0.1;
                mesh.scale.set(curS, curS, curS);

                mesh.rotation.y += (trotY - mesh.rotation.y) * 0.1;
                mesh.material.opacity += (topa - mesh.material.opacity) * 0.1;
            });

            renderer.render(scene, camera3D);
        }
        animate();

        window.addEventListener('resize', () => {
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            if (e.target.closest('.bottom-dock') || e.target.closest('.love-confession-overlay')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera3D);
            const intersects = raycaster.intersectObjects(photoMeshes);
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if (clickedMesh.callback) clickedMesh.callback();
            }
        });

        /* -------------------------------------------------------------
           5. MEDIAPIPE AI TIẾT KIỆM TẢI CPU CHO MAC ĐỜI CŨ (THROTTLED 15FPS)
        ------------------------------------------------------------- */
        const video = document.getElementById('webcamVideo');
        const hudStatus = document.getElementById('hudStatus');

        function isFingerExtended(lm, tipIdx, pipIdx) {
            const dTip = Math.hypot(lm[tipIdx].x - lm[0].x, lm[tipIdx].y - lm[0].y);
            const dPip = Math.hypot(lm[pipIdx].x - lm[0].x, lm[pipIdx].y - lm[0].y);
            return dTip > dPip * 1.15;
        }

        let lastDetectedGesture = '';
        let gestureHoldFrames = 0;
        let lastHandNormX = 0.5;
        let swipeCooldown = 0;

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // Lite Model cho CPU 2 nhân
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((res) => {
            if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
                hudStatus.innerText = "Đang tìm tay...";
                return;
            }

            const lm = res.multiHandLandmarks[0];
            const handNormX = 1 - lm[9].x; 
            const handNormY = lm[9].y;

            targetRotY = (handNormX - 0.5) * 2.2;
            targetRotX = (handNormY - 0.5) * 1.5;

            const isIndex = isFingerExtended(lm, 8, 6);
            const isMiddle = isFingerExtended(lm, 12, 10);
            const isRing = isFingerExtended(lm, 16, 14);
            const isPinky = isFingerExtended(lm, 20, 18);

            let detected = '';

            if (isIndex && isMiddle && !isRing && !isPinky) {
                detected = 'TWO_FINGERS';
                hudStatus.innerText = "✌️ 2 Ngón: Tỏ tình";
            }
            else if (isIndex && !isMiddle && !isRing && !isPinky) {
                detected = 'ONE_FINGER';
                hudStatus.innerText = "☝️ 1 Ngón: Zoom ảnh";
            }
            else if (isIndex && isMiddle && isRing && isPinky) {
                detected = 'OPEN_PALM';
                hudStatus.innerText = "🖐️ Xòe: Bung ảnh";
            }
            else if (!isIndex && !isMiddle && !isRing && !isPinky) {
                detected = 'FIST';
                hudStatus.innerText = "✊ Nắm: Gom tim";
            }

            // CHỈ KHI ĐANG ZOOM THÌ DI CHUYỂN TAY MỚI CHUYỂN ẢNH:
            if (isZoomed && !document.getElementById('loveModal').classList.contains('active')) {
                if (swipeCooldown > 0) swipeCooldown--;
                const deltaX = handNormX - lastHandNormX;

                if (swipeCooldown === 0) {
                    if (deltaX > 0.045) {
                        currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotoCount;
                        playChimeSound();
                        updateStatusBadge(`☝️ Zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount}`);
                        swipeCooldown = 12;
                    } else if (deltaX < -0.045) {
                        currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotoCount) % currentPhotoCount;
                        playChimeSound();
                        updateStatusBadge(`☝️ Zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount}`);
                        swipeCooldown = 12;
                    }
                }

                if (detected === 'ONE_FINGER' && currentPhotoCount > 1) {
                    const clampedX = Math.max(0.15, Math.min(0.85, handNormX));
                    const ratio = (clampedX - 0.15) / 0.7;
                    const targetIdx = Math.round(ratio * (currentPhotoCount - 1));
                    if (targetIdx !== currentPhotoIndex && Math.abs(deltaX) < 0.03) {
                        currentPhotoIndex = targetIdx;
                        playChimeSound();
                        updateStatusBadge(`☝️ Zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount}`);
                    }
                }
            }

            lastHandNormX = handNormX;

            if (detected) {
                if (detected === lastDetectedGesture) {
                    gestureHoldFrames++;
                    if (gestureHoldFrames === 3) {
                        if (detected === 'FIST') {
                            isBung = false;
                            isZoomed = false;
                            closeLoveModal();
                            document.getElementById('bungBtnText').innerText = "Bung Tim";
                            updateStatusBadge("✊ Nắm tay: Gom Trái Tim 3D");
                        } 
                        else if (detected === 'OPEN_PALM') {
                            isBung = true;
                            isZoomed = false;
                            closeLoveModal();
                            document.getElementById('bungBtnText').innerText = "Gom Tim";
                            updateStatusBadge(`🖐️ Xòe tay: Bung Trái Tim & ${currentPhotoCount} ảnh`);
                        } 
                        else if (detected === 'ONE_FINGER') {
                            isBung = true;
                            isZoomed = true;
                            closeLoveModal();
                            updateStatusBadge(`☝️ Đang zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount} ở giữa`);
                            playChimeSound();
                        } 
                        else if (detected === 'TWO_FINGERS') {
                            updateStatusBadge("✌️ 2 Ngón tay: ANH YÊU EM ❤️");
                            triggerLoveConfession();
                        }
                    }
                } else {
                    lastDetectedGesture = detected;
                    gestureHoldFrames = 0;
                }
            }
        });

        // GIỚI HẠN TẦN SỐ GỬI KHUNG HÌNH (THROTTLE) ĐỂ CPU MAC 2015 KHÔNG BỊ NÓNG
        let isProcessing = false;
        let lastProcessTime = 0;

        new Camera(video, {
            onFrame: async () => {
                const now = performance.now();
                // Chỉ xử lý AI tối đa 15 lần/giây (cách nhau ít nhất 65ms)
                if (!isProcessing && (now - lastProcessTime > 65)) {
                    isProcessing = true;
                    lastProcessTime = now;
                    try {
                        await hands.send({ image: video });
                    } catch (e) {}
                    isProcessing = false;
                }
            },
            width: 240, height: 180 // Độ phân giải đầu vào tối ưu
        }).start().then(() => {
            hudStatus.innerText = "Camera sẵn sàng!";
        }).catch((err) => {
            hudStatus.innerText = "Dùng nút bên dưới";
        });
    </script>
</body>
</html>
