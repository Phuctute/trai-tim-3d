<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark only">
    <title>3D Heart & Spatial Album (Samsung Tab S8+)</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js CDN (Tự động fallback offline nếu không có mạng) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #020005;
            color: #fff; font-family: 'Quicksand', sans-serif;
            position: fixed;
        }
        #webgl-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* Top Action Bar */
        .top-bar {
            position: fixed; top: 16px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 30; pointer-events: none;
        }
        .status-badge {
            pointer-events: auto;
            background: rgba(22, 5, 28, 0.8); backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 105, 180, 0.45); border-radius: 24px;
            padding: 7px 20px; font-size: 0.88rem; color: #fce7f3;
            box-shadow: 0 0 20px rgba(255, 42, 112, 0.4);
            margin: 0 auto; font-weight: 700; letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .icon-btn {
            pointer-events: auto; width: 46px; height: 46px; border-radius: 50%;
            background: rgba(22, 5, 28, 0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.45); color: #ff94c2;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.15rem; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .icon-btn:active { transform: scale(0.9); background: #ff2a70; color: #fff; }

        /* Quick Touch Mode Bar (Dành riêng cho màn hình cảm ứng Tab S8+) */
        .gesture-pill-dock {
            position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 25; pointer-events: auto;
        }
        .pill-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 105, 180, 0.4);
            color: #ffe4f0; padding: 7px 15px; border-radius: 20px;
            font-size: 0.82rem; font-family: 'Quicksand', sans-serif;
            font-weight: 700; cursor: pointer; backdrop-filter: blur(12px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .pill-btn:active, .pill-btn.active {
            background: linear-gradient(135deg, #ff2a70 0%, #ba1254 100%);
            border-color: transparent; color: #fff;
            box-shadow: 0 0 16px rgba(255, 42, 112, 0.7);
            transform: scale(0.96);
        }

        /* Bottom Floating Dock - Thiết kế to rõ cho Tab S8+ */
        .bottom-dock {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 10px; z-index: 25;
            background: rgba(18, 4, 24, 0.88);
            backdrop-filter: blur(20px);
            padding: 8px 20px; border-radius: 40px;
            border: 1px solid rgba(255, 105, 180, 0.45);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
            max-width: 95vw;
        }
        .btn {
            background: linear-gradient(135deg, #ff2a70 0%, #ba1254 100%);
            border: none; color: #fff; padding: 9px 18px; border-radius: 30px;
            font-family: 'Quicksand', sans-serif; font-size: 0.85rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 112, 0.45);
            transition: all 0.2s; white-space: nowrap;
        }
        .btn:active { transform: scale(0.94); }
        .btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* Bộ chọn số lượng ảnh (1 đến 5) */
        .count-picker {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 3px 8px;
            border: 1px solid rgba(255, 105, 180, 0.25);
        }
        .count-picker span { font-size: 0.74rem; color: #f9a8d4; margin-right: 2px; }
        .cnt-btn {
            background: transparent; border: none; color: #ffb8da;
            width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; font-size: 0.82rem; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .cnt-btn.active, .cnt-btn:active {
            background: #ff2a70; color: #fff;
            box-shadow: 0 0 10px #ff2a70;
        }

        /* =============================================================
           "ANH YÊU EM" TOÀN MÀN HÌNH - KHÔNG BỊ CHE, KHÔNG NÚT THỪA
        ============================================================= */
        .love-confession-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(35, 2, 25, 0.94) 0%, rgba(8, 0, 12, 0.98) 100%);
            backdrop-filter: blur(16px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
            cursor: pointer;
        }
        .love-confession-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .love-card-center {
            text-align: center; padding: 25px;
            transform: scale(0.92);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }
        .love-confession-overlay.active .love-card-center {
            transform: scale(1);
        }
        .love-neon-title {
            font-family: 'Great Vibes', 'Dancing Script', cursive;
            font-size: 6.2rem; line-height: 1.15;
            color: #ffffff;
            text-shadow: 
                0 0 10px #ff69b4,
                0 0 25px #ff1493,
                0 0 50px #ff007f,
                0 0 80px #ff0055,
                0 0 120px #ff0055,
                0 0 160px #ff007f;
            margin-bottom: 15px;
            animation: pulseNeonTitle 2.5s infinite ease-in-out;
        }
        @keyframes pulseNeonTitle {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 10px #ff69b4, 0 0 25px #ff1493, 0 0 50px #ff007f, 0 0 80px #ff0055;
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 15px #fff, 0 0 35px #ff69b4, 0 0 65px #ff1493, 0 0 95px #ff0055;
            }
        }
        .love-neon-sub {
            font-size: 1.45rem; color: #ffe4f3;
            letter-spacing: 4px; text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
            margin-bottom: 20px;
        }
        /* Pháo hoa tim bay lượn */
        .sparkle-heart {
            position: fixed; pointer-events: none; z-index: 1000000;
            animation: flyUpAndFade 2.4s ease-out forwards;
        }
        @keyframes flyUpAndFade {
            0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(var(--rot)); opacity: 0; }
        }

        #photoMultiInput, #audioInput { display: none; }

        @media (max-width: 900px) and (orientation: portrait) {
            .love-neon-title { font-size: 4.2rem; }
            .bottom-dock { padding: 6px 14px; gap: 6px; bottom: 16px; }
            .btn { padding: 8px 14px; font-size: 0.78rem; }
            .gesture-pill-dock { bottom: 74px; }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <!-- Top Action Bar -->
    <div class="top-bar">
        <button class="icon-btn" onclick="toggleMusic()" title="Bật/Tắt Nhạc">
            <i class="fa-solid fa-music" id="topMusicIcon"></i>
        </button>
        <div class="status-badge" id="statusBadge">
            ✊ Trái Tim 3D (Chạm màn hình để bung ảnh)
        </div>
        <button class="icon-btn" onclick="toggleFullscreen()" title="Toàn màn hình">
            <i class="fa-solid fa-expand" id="fsIcon"></i>
        </button>
    </div>

    <!-- Quick Touch Mode Bar (Chạm trực tiếp trên màn hình Tab S8+) -->
    <div class="gesture-pill-dock">
        <button class="pill-btn active" id="pill-fist" onclick="triggerPill('FIST')">✊ Gom tim</button>
        <button class="pill-btn" id="pill-open" onclick="triggerPill('OPEN_PALM')">🖐️ Bung ảnh</button>
        <button class="pill-btn" id="pill-one" onclick="triggerPill('ONE_FINGER')">☝️ Zoom ảnh</button>
        <button class="pill-btn" id="pill-two" onclick="triggerPill('TWO_FINGERS')">✌️ Tỏ tình</button>
    </div>

    <!-- Bottom Dock -->
    <div class="bottom-dock">
        <button class="btn" onclick="document.getElementById('photoMultiInput').click()">
            <i class="fa-solid fa-images"></i> Thay Ảnh
        </button>

        <div class="count-picker">
            <span>Số ảnh:</span>
            <button class="cnt-btn" onclick="setPhotoCount(1)">1</button>
            <button class="cnt-btn" onclick="setPhotoCount(2)">2</button>
            <button class="cnt-btn" onclick="setPhotoCount(3)">3</button>
            <button class="cnt-btn" onclick="setPhotoCount(4)">4</button>
            <button class="cnt-btn active" onclick="setPhotoCount(5)">5</button>
        </div>

        <button class="btn secondary" id="musicBtn" onclick="toggleMusic()">
            <i class="fa-solid fa-music"></i> <span id="musicText">Nhạc</span>
        </button>
        <button class="btn secondary" onclick="document.getElementById('audioInput').click()">
            <i class="fa-solid fa-file-audio"></i> MP3
        </button>
        <button class="btn secondary" onclick="toggleBungMode()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="bungBtnText">Bung Tim</span>
        </button>
        <button class="btn secondary" onclick="triggerLoveConfession()">
            <i class="fa-solid fa-heart" style="color:#ff2a70;"></i> Tỏ Tình
        </button>
    </div>

    <!-- "ANH YÊU EM" Fullscreen Overlay -->
    <div class="love-confession-overlay" id="loveModal" onclick="closeLoveModal()">
        <div class="love-card-center">
            <h1 class="love-neon-title" id="loveMainText" onclick="event.stopPropagation(); editLoveText();">
                Anh Yêu Em ❤️
            </h1>
            <p class="love-neon-sub" id="loveSubText">
                Mãi Mãi Một Tình Yêu • Hạnh Phúc Trọn Đời
            </p>
        </div>
    </div>

    <input type="file" id="photoMultiInput" accept="image/*" multiple>
    <input type="file" id="audioInput" accept="audio/*">
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-moment-2964.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* -------------------------------------------------------------
           1. THREE.JS TỐI ƯU HÓA HOÀN HẢO CHO SAMSUNG GALAXY TAB S8+
           - Màn hình 120Hz Super AMOLED (2800 x 1752)
           - Chạy độc lập 100%, KHÔNG PHỤ THUỘC VÀO CAMERA NÊN KHÔNG BAO GIỜ BỊ CRASH
           - Cảm ứng đa điểm, vuốt lướt 120 FPS mượt mà
        ------------------------------------------------------------- */
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3D.position.z = 88;

        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: false,
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Khóa pixelRatio ở 1.0 để đảm bảo 120 FPS mượt mà tuyệt đối trên Tab S8+ và điện thoại
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));

        function createGlowSprite() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 105, 180, 0.85)');
            grad.addColorStop(0.7, 'rgba(255, 20, 147, 0.25)');
            grad.addColorStop(1, 'rgba(255, 0, 100, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        const PARTICLE_COUNT = 1500;
        const heartPositions = new Float32Array(PARTICLE_COUNT * 3);
        const galaxyPositions = new Float32Array(PARTICLE_COUNT * 3);
        const currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const t = Math.PI * 2 * Math.random();
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 14 * Math.sin(t);
            const scale = 2.15 + (Math.random() - 0.5) * 0.4;

            heartPositions[i * 3] = x * scale;
            heartPositions[i * 3 + 1] = y * scale;
            heartPositions[i * 3 + 2] = z * scale;

            const radius = Math.random() * 92 + 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI * 0.85;
            galaxyPositions[i * 3] = radius * Math.cos(theta) * Math.cos(phi);
            galaxyPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.cos(phi);
            galaxyPositions[i * 3 + 2] = radius * Math.sin(phi);

            // ⭐ MẶC ĐỊNH KHI MỞ: BẮT ĐẦU Ở TRÁI TIM CHƯA BUNG ⭐
            currentPositions[i * 3] = heartPositions[i * 3];
            currentPositions[i * 3 + 1] = heartPositions[i * 3 + 1];
            currentPositions[i * 3 + 2] = heartPositions[i * 3 + 2];

            const cRatio = Math.random();
            colors[i * 3] = 1.0;
            colors[i * 3 + 1] = 0.2 + cRatio * 0.45;
            colors[i * 3 + 2] = 0.55 + cRatio * 0.45;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 3.5,
            map: createGlowSprite(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.92,
            depthWrite: false,
            depthTest: false
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        /* -------------------------------------------------------------
           2. 3D 1-5 PHOTO SYSTEM (TỰ TẠO ẢNH NGHỆ THUẬT KHÔNG LO MẤT MẠNG)
        ------------------------------------------------------------- */
        let userCustomPhotos = [];
        let currentPhotoCount = 5;

        // ⭐ Mặc định: Chưa bung (isBung = false) ⭐
        let isBung = false;
        let isZoomed = false;
        let currentPhotoIndex = 0;
        let smoothCarouselPos = 0.0;

        const photosGroup = new THREE.Group();
        scene.add(photosGroup);

        let photoMeshes = [];
        const sharedGeo = new THREE.PlaneGeometry(16, 20);

        // Vẽ 5 bức tranh nghệ thuật tình yêu tuyệt đẹp (100% không phụ thuộc internet)
        function createRomanticCardCanvas(index, customImgSrc = null, callback) {
            const c = document.createElement('canvas');
            c.width = 400; c.height = 480;
            const ctx = c.getContext('2d');

            function finishCard() {
                // Viền Polaroid trắng sang trọng
                ctx.strokeStyle = '#ff69b4';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.font = 'bold 24px "Dancing Script", cursive';
                ctx.fillStyle = '#ff2a70';
                ctx.textAlign = 'center';
                const captions = [
                    'Our Love Story ❤️',
                    'Together Forever 💕',
                    'Sweet Memories 🌹',
                    'Destiny Of Life ✨',
                    'Forever With You 💖'
                ];
                ctx.fillText(captions[index % captions.length], 200, 442);

                const texture = new THREE.CanvasTexture(c);
                texture.generateMipmaps = false;
                texture.minFilter = THREE.LinearFilter;
                callback(texture);
            }

            // Nền thẻ trắng ngà sang trọng
            ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(8, 8, 384, 464, 20);
            else ctx.rect(8, 8, 384, 464);
            ctx.fill();

            // Nếu người dùng tải ảnh từ máy tính bảng:
            if (customImgSrc) {
                const img = new Image();
                img.onload = () => {
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(18, 18, 364, 380, 14);
                    else ctx.rect(18, 18, 364, 380);
                    ctx.clip();

                    const hRatio = 364 / img.width;
                    const vRatio = 380 / img.height;
                    const ratio = Math.max(hRatio, vRatio);
                    const centerShift_x = 18 + (364 - img.width * ratio) / 2;
                    const centerShift_y = 18 + (380 - img.height * ratio) / 2;
                    ctx.drawImage(img, centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
                    ctx.restore();

                    finishCard();
                };
                img.onerror = () => {
                    drawArtDefault(ctx, index);
                    finishCard();
                };
                img.src = customImgSrc;
            } else {
                drawArtDefault(ctx, index);
                finishCard();
            }
        }

        // Tự vẽ ảnh nghệ thuật lung linh sẵn sàng 100% offline
        function drawArtDefault(ctx, index) {
            const palettes = [
                ['#ff5858', '#f857a6'],
                ['#ee0979', '#ff6a00'],
                ['#7f00ff', '#e100ff'],
                ['#fa709a', '#fee140'],
                ['#f093fb', '#f5576c']
            ];
            const p = palettes[index % palettes.length];
            const grad = ctx.createLinearGradient(18, 18, 382, 398);
            grad.addColorStop(0, p[0]);
            grad.addColorStop(1, p[1]);

            ctx.fillStyle = grad;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(18, 18, 364, 380, 14);
            else ctx.rect(18, 18, 364, 380);
            ctx.fill();

            // Biểu tượng trái tim nghệ thuật
            ctx.font = '85px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const icons = ['❤️', '💖', '🌹', '💕', '🥰'];
            ctx.fillText(icons[index % icons.length], 200, 185);

            ctx.font = 'bold 24px "Quicksand", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 8;
            const titles = ['Kỷ Niệm Ngày Đầu', 'Nụ Cười Của Em', 'Hạnh Phúc Giản Đơn', 'Ánh Sao Đêm', 'Mãi Mãi Yêu Em'];
            ctx.fillText(titles[index % titles.length], 200, 275);
            ctx.shadowBlur = 0;
        }

        function buildPhotoMeshes() {
            while (photosGroup.children.length > 0) {
                const child = photosGroup.children[0];
                if (child.material) {
                    if (child.material.map) child.material.map.dispose();
                    child.material.dispose();
                }
                photosGroup.remove(child);
            }
            photoMeshes = [];

            const count = currentPhotoCount;
            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(sharedGeo, mat);
                mesh.scale.set(0, 0, 0);
                mesh.userData = { index: i };

                mesh.callback = () => {
                    currentPhotoIndex = i;
                    isZoomed = true;
                    isBung = true;
                    updatePillUI('ONE_FINGER');
                    updateStatusBadge(`☝️ Đang zoom ảnh ${i + 1}/${count} (Vuốt để đổi)`);
                    playChimeSound();
                };

                photosGroup.add(mesh);
                photoMeshes.push(mesh);

                const customSrc = userCustomPhotos.length > 0 ? userCustomPhotos[i % userCustomPhotos.length] : null;
                createRomanticCardCanvas(i, customSrc, (tex) => {
                    mat.map = tex;
                    mat.needsUpdate = true;
                });
            }
        }

        buildPhotoMeshes();

        // Tải ảnh từ thư viện ảnh máy tính bảng Android
        document.getElementById('photoMultiInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files).slice(0, 5);
            if (files.length > 0) {
                userCustomPhotos = files.map(file => URL.createObjectURL(file));
                currentPhotoCount = files.length;
                currentPhotoIndex = 0;
                smoothCarouselPos = 0;
                updateCountButtonsUI(currentPhotoCount);
                buildPhotoMeshes();
                updateStatusBadge(`Đã nạp ${files.length} ảnh của bạn ❤️ (Chạm để xem)`);
            }
        });

        function setPhotoCount(cnt) {
            currentPhotoCount = Math.min(Math.max(1, cnt), 5);
            currentPhotoIndex = Math.min(currentPhotoIndex, currentPhotoCount - 1);
            updateCountButtonsUI(currentPhotoCount);
            buildPhotoMeshes();
            updateStatusBadge(`Đang chọn hiển thị ${currentPhotoCount} ảnh`);
        }

        function updateCountButtonsUI(cnt) {
            document.querySelectorAll('.cnt-btn').forEach((b, idx) => {
                b.classList.toggle('active', (idx + 1) === cnt);
            });
        }

        function updateStatusBadge(text) {
            const b = document.getElementById('statusBadge');
            b.innerText = text;
        }

        function updatePillUI(gesture) {
            document.querySelectorAll('.pill-btn').forEach(p => p.classList.remove('active'));
            if (gesture === 'FIST') document.getElementById('pill-fist').classList.add('active');
            if (gesture === 'OPEN_PALM') document.getElementById('pill-open').classList.add('active');
            if (gesture === 'ONE_FINGER') document.getElementById('pill-one').classList.add('active');
            if (gesture === 'TWO_FINGERS') document.getElementById('pill-two').classList.add('active');
        }

        function toggleBungMode() {
            if (!isBung) {
                isBung = true;
                isZoomed = false;
                document.getElementById('bungBtnText').innerText = "Gom Tim";
                updatePillUI('OPEN_PALM');
                updateStatusBadge(`🖐️ Trái tim bung & ${currentPhotoCount} ảnh quanh tâm`);
            } else {
                isBung = false;
                isZoomed = false;
                document.getElementById('bungBtnText').innerText = "Bung Tim";
                updatePillUI('FIST');
                updateStatusBadge("✊ Trái Tim 3D (Chạm màn hình để bung)");
            }
        }

        function triggerPill(gesture) {
            updatePillUI(gesture);
            if (gesture === 'FIST') {
                isBung = false;
                isZoomed = false;
                closeLoveModal();
                document.getElementById('bungBtnText').innerText = "Bung Tim";
                updateStatusBadge("✊ Nắm tay: Gom Trái Tim 3D");
            } else if (gesture === 'OPEN_PALM') {
                isBung = true;
                isZoomed = false;
                closeLoveModal();
                document.getElementById('bungBtnText').innerText = "Gom Tim";
                updateStatusBadge(`🖐️ Xòe tay: Bung Trái Tim & ${currentPhotoCount} ảnh`);
            } else if (gesture === 'ONE_FINGER') {
                isBung = true;
                isZoomed = true;
                closeLoveModal();
                updateStatusBadge(`☝️ Zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount} ở giữa`);
                playChimeSound();
            } else if (gesture === 'TWO_FINGERS') {
                updateStatusBadge("✌️ 2 Ngón tay: ANH YÊU EM ❤️");
                triggerLoveConfession();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                document.getElementById('fsIcon').className = 'fa-solid fa-compress';
            } else {
                document.exitFullscreen().catch(() => {});
                document.getElementById('fsIcon').className = 'fa-solid fa-expand';
            }
        }

        /* -------------------------------------------------------------
           3. AUDIO & TỎ TÌNH
        ------------------------------------------------------------- */
        const bgMusic = document.getElementById('bgMusic');
        const musicText = document.getElementById('musicText');
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    musicText.innerText = "Tắt Nhạc";
                    document.getElementById('topMusicIcon').style.color = '#ff2a70';
                }).catch(() => {});
            } else {
                bgMusic.pause();
                musicText.innerText = "Nhạc";
                document.getElementById('topMusicIcon').style.color = '#ff94c2';
            }
        }
        document.getElementById('audioInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                bgMusic.src = URL.createObjectURL(e.target.files[0]);
                bgMusic.play();
                musicText.innerText = "Tắt Nhạc";
                document.getElementById('topMusicIcon').style.color = '#ff2a70';
            }
        });

        function editLoveText() {
            const val = prompt("Nhập lời tỏ tình / yêu thương:", document.getElementById('loveMainText').innerText);
            if (val) document.getElementById('loveMainText').innerText = val;
        }

        let audioCtx = null;
        function playChimeSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + idx * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.07 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.07);
                    osc.stop(audioCtx.currentTime + idx * 0.07 + 0.5);
                });
            } catch (err) {}
        }

        function triggerLoveConfession() {
            document.getElementById('loveModal').classList.add('active');
            playChimeSound();
            spawnHeartsExplosion();
        }

        function closeLoveModal() {
            document.getElementById('loveModal').classList.remove('active');
        }

        function spawnHeartsExplosion() {
            const emojis = ['💖', '💕', '❤️', '✨', '🌹', '🥰', '💘'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'sparkle-heart';
                    h.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    h.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 320) + 'px';
                    h.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 160) + 'px';
                    h.style.fontSize = (Math.random() * 28 + 20) + 'px';
                    h.style.setProperty('--tx', `${(Math.random() - 0.5) * 650}px`);
                    h.style.setProperty('--ty', `${-Math.random() * 550 - 120}px`);
                    h.style.setProperty('--rot', `${(Math.random() - 0.5) * 120}deg`);
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 2200);
                }, i * 35);
            }
        }

        /* -------------------------------------------------------------
           4. RENDER LOOP (120 FPS SUPREME SMOOTH TRÊN SAMSUNG TAB S8+)
        ------------------------------------------------------------- */
        let targetRotX = 0, targetRotY = 0;
        let clock = new THREE.Clock();
        let currentMorph = 0.0; // 0.0: Heart, 1.0: Galaxy

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const targetMorph = isBung ? 1.0 : 0.0;
            const morphDiff = Math.abs(targetMorph - currentMorph);

            // ⭐ SIÊU TỐI ƯU HÓA: CHỈ cập nhật buffer đỉnh khi đang chuyển đổi bung/gom ⭐
            // Giúp giải phóng 98% tải CPU và GPU, giữ trọn 120 FPS không giật lag!
            if (morphDiff > 0.001) {
                currentMorph += (targetMorph - currentMorph) * 0.08;
                const positions = particleGeometry.attributes.position.array;
                const len = PARTICLE_COUNT * 3;
                for (let i = 0; i < len; i += 3) {
                    positions[i] = heartPositions[i] + (galaxyPositions[i] - heartPositions[i]) * currentMorph;
                    positions[i + 1] = heartPositions[i + 1] + (galaxyPositions[i + 1] - heartPositions[i + 1]) * currentMorph;
                    positions[i + 2] = heartPositions[i + 2] + (galaxyPositions[i + 2] - heartPositions[i + 2]) * currentMorph;
                }
                particleGeometry.attributes.position.needsUpdate = true;
            }

            // Nhịp tim đập 3D thực thi 100% bằng ma trận GPU (Zero CPU buffer upload):
            if (!isBung) {
                const beatScale = 1 + 0.06 * Math.sin(elapsedTime * 6) + 0.03 * Math.sin(elapsedTime * 12);
                particleSystem.scale.set(beatScale, beatScale, beatScale);
            } else {
                particleSystem.scale.set(1, 1, 1);
            }

            // Xoay nhẹ tự nhiên + phản hồi cảm ứng
            particleSystem.rotation.x += (targetRotX - particleSystem.rotation.x) * 0.06;
            particleSystem.rotation.y += (targetRotY - particleSystem.rotation.y) * 0.06 + 0.0015;

            if (isZoomed) {
                photosGroup.rotation.x += (targetRotX * 0.12 - photosGroup.rotation.x) * 0.08;
                photosGroup.rotation.y += (targetRotY * 0.12 - photosGroup.rotation.y) * 0.08;
                smoothCarouselPos += (currentPhotoIndex - smoothCarouselPos) * 0.12;
            } else {
                photosGroup.rotation.x = particleSystem.rotation.x;
                photosGroup.rotation.y = particleSystem.rotation.y;
            }

            const count = photoMeshes.length;

            photoMeshes.forEach((mesh, i) => {
                let tx = 0, ty = 0, tz = 0, trotY = 0, ts = 1, topa = 1;

                if (!isBung) {
                    // MẶC ĐỊNH CHƯA BUNG: ẢNH GIẤU HOÀN TOÀN Ở TÂM, SCALE = 0
                    tx = 0; ty = 0; tz = 0; trotY = 0; ts = 0; topa = 0;
                } 
                else if (isZoomed) {
                    // KHI ZOOM: ẢNH PHÓNG TO GIỮ NGUYÊN GIỮA MÀN HÌNH
                    const rel = i - smoothCarouselPos;
                    tx = rel * 34;
                    tz = 44 - Math.min(Math.abs(rel), 3.0) * 22;
                    ty = -Math.pow(rel, 2) * 1.0;
                    trotY = -Math.tanh(rel) * 0.55;
                    ts = Math.max(0.35, 1.68 - Math.abs(rel) * 0.52);
                    topa = Math.max(0.18, 1.0 - Math.abs(rel) * 0.42);
                } 
                else {
                    // KHI BUNG TRÁI TIM: BỐ CỤC NHƯ CŨ (TẤT CẢ ẢNH NẰM TRONG VÒNG QUỸ ĐẠO, KHÔNG DI CHUYỂN)
                    if (count === 1) {
                        tx = 0; ty = 0; tz = 8; ts = 1.15; trotY = 0; topa = 1;
                    } else if (count === 2) {
                        tx = (i === 0 ? -24 : 24); ty = 0; tz = 4;
                        ts = 0.95; trotY = (i === 0 ? 0.25 : -0.25); topa = 1;
                    } else if (count === 3) {
                        const angle = (i * (Math.PI * 2) / 3) - Math.PI / 2;
                        tx = Math.cos(angle) * 32; ty = Math.sin(angle) * 22; tz = 0;
                        ts = 0.85; trotY = Math.atan2(Math.cos(angle), 3) * 0.5; topa = 1;
                    } else if (count === 4) {
                        const angles = [-Math.PI * 0.75, -Math.PI * 0.25, Math.PI * 0.25, Math.PI * 0.75];
                        const a = angles[i];
                        tx = Math.cos(a) * 36; ty = Math.sin(a) * 24; tz = (i % 2 === 0 ? 5 : -5);
                        ts = 0.82; trotY = Math.cos(a) * 0.3; topa = 1;
                    } else {
                        const angle = (i * (Math.PI * 2) / 5) - Math.PI / 2;
                        tx = Math.cos(angle) * 38; ty = Math.sin(angle) * 26; tz = Math.sin(i * 2) * 5;
                        ts = 0.82; trotY = Math.cos(angle) * 0.35; topa = 1;
                    }
                    ty += Math.sin(elapsedTime * 2 + i) * 0.4;
                }

                mesh.position.x += (tx - mesh.position.x) * 0.1;
                mesh.position.y += (ty - mesh.position.y) * 0.1;
                mesh.position.z += (tz - mesh.position.z) * 0.1;

                const curS = mesh.scale.x + (ts - mesh.scale.x) * 0.1;
                mesh.scale.set(curS, curS, curS);

                mesh.rotation.y += (trotY - mesh.rotation.y) * 0.1;
                mesh.material.opacity += (topa - mesh.material.opacity) * 0.1;
            });

            renderer.render(scene, camera3D);
        }
        animate();

        window.addEventListener('resize', () => {
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* -------------------------------------------------------------
           5. ĐIỀU KHIỂN CẢM ỨNG CHẠM & VUỐT SIÊU NHẠY CHO TAB S8+
        ------------------------------------------------------------- */
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let lastTapTime = 0;
        let isTouching = false;

        window.addEventListener('pointerdown', (e) => {
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            touchStartTime = Date.now();
            isTouching = true;

            // Double tap kích hoạt Tỏ tình
            const currentTime = Date.now();
            if (currentTime - lastTapTime < 300) {
                triggerLoveConfession();
            }
            lastTapTime = currentTime;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isTouching) return;
            const diffX = e.clientX - touchStartX;
            const diffY = e.clientY - touchStartY;

            if (!isZoomed && isBung) {
                targetRotY = (diffX / window.innerWidth) * 2.5;
                targetRotX = (diffY / window.innerHeight) * 1.5;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!isTouching) return;
            isTouching = false;
            const diffX = e.clientX - touchStartX;
            const diffY = e.clientY - touchStartY;
            const duration = Date.now() - touchStartTime;

            // Nếu vuốt ngang dứt khoát (> 35px)
            if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) && duration < 500) {
                if (!isBung) {
                    isBung = true;
                    document.getElementById('bungBtnText').innerText = "Gom Tim";
                }
                isZoomed = true;
                updatePillUI('ONE_FINGER');

                if (diffX < 0) {
                    // Vuốt sang trái -> Ảnh tiếp theo
                    currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotoCount;
                } else {
                    // Vuốt sang phải -> Ảnh trước
                    currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotoCount) % currentPhotoCount;
                }
                playChimeSound();
                updateStatusBadge(`☝️ Zoom ảnh ${currentPhotoIndex + 1}/${currentPhotoCount} (Vuốt để đổi)`);
            } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10 && duration < 300) {
                // Chạm nhẹ (Tap) vào màn hình
                handleScreenTap(e.clientX, e.clientY);
            }
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleScreenTap(clientX, clientY) {
            // Kiểm tra click vào nút UI
            const elem = document.elementFromPoint(clientX, clientY);
            if (elem && (elem.closest('.bottom-dock') || elem.closest('.love-confession-overlay') || elem.closest('.top-bar') || elem.closest('.gesture-pill-dock'))) {
                return;
            }

            // Raycaster kiểm tra chạm vào ảnh 3D
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera3D);
            const intersects = raycaster.intersectObjects(photoMeshes);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                if (clickedMesh.callback) clickedMesh.callback();
            } else {
                if (!isBung) {
                    // Nếu đang ở Trái Tim: Chạm là Bung Tim!
                    toggleBungMode();
                } else if (isZoomed) {
                    // Nếu đang Zoom: Chạm ra ngoài là thu ảnh về lại vòng tròn
                    isZoomed = false;
                    updatePillUI('OPEN_PALM');
                    updateStatusBadge(`🖐️ Trái tim bung & ${currentPhotoCount} ảnh`);
                }
            }
        }

        /* -------------------------------------------------------------
           6. CẢM BIẾN NGHIÊNG CON QUAY HỒI CHUYỂN (GYROSCOPE HOLOGRAM)
        ------------------------------------------------------------- */
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (!isZoomed && isBung && e.gamma !== null && e.beta !== null) {
                    // Nghiêng máy tính bảng để xoay góc nhìn 3D Hologram sống động
                    targetRotY = (e.gamma / 45) * 1.5;
                    targetRotX = ((e.beta - 45) / 45) * 1.0;
                }
            }, true);
        }
    </script>
