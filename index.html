<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Anh Thích Em Lắm Nha 💕</title>

    <!-- Google Fonts: Comfortaa & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- MediaPipe Hands & Camera API -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary-pink: #FF6584;
            --soft-pink: #FF8DA1;
            --pastel-blush: #FFF0F3;
            --cream-bg: #FFF7F9;
            --text-color: #4A3E4E;
            --text-soft: #8C7A8F;
            --card-bg: rgba(255, 255, 255, 0.95);
            --bubbly-shadow: 0 14px 35px rgba(255, 101, 132, 0.18), 0 4px 12px rgba(0, 0, 0, 0.04);
            --font-main: 'Comfortaa', cursive, -apple-system, sans-serif;
            --font-sub: 'Quicksand', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FFF0F3 0%, #FFE5EC 50%, #FFF5EB 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* Floating background clouds & sparkles */
        .sky-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            filter: blur(8px);
            animation: floatCloud 25s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .cloud-1 {
            width: 140px; height: 50px; top: 12%; left: -160px;
            animation-duration: 28s;
        }
        .cloud-1::before { width: 60px; height: 60px; top: -25px; left: 25px; }
        .cloud-1::after { width: 45px; height: 45px; top: -18px; left: 70px; }

        .cloud-2 {
            width: 180px; height: 60px; top: 65%; left: -200px;
            animation-duration: 35s;
            animation-delay: 10s;
        }
        .cloud-2::before { width: 75px; height: 75px; top: -30px; left: 30px; }
        .cloud-2::after { width: 55px; height: 55px; top: -20px; left: 95px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 240px)); }
        }

        /* Ambient floating hearts & blossom petals */
        .floating-heart-item {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: riseUp 6s linear forwards;
            opacity: 0.85;
            z-index: 1;
        }

        @keyframes riseUp {
            0% { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-50px) scale(1.1) rotate(45deg); opacity: 0; }
        }

        /* TOP BAR: ONLY CUTE ROUND ICONS (No text labels) */
        .cute-nav {
            position: fixed;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn-icon-bubble {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid rgba(255, 141, 161, 0.45);
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: var(--bubbly-shadow);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 22px;
        }

        .btn-icon-bubble:hover {
            transform: scale(1.15) rotate(8deg);
            border-color: var(--primary-pink);
            background: #FFFFFF;
        }

        .btn-icon-bubble:active {
            transform: scale(0.95);
        }

        .btn-icon-bubble.playing {
            animation: pulseMusicBubble 1.4s infinite ease-in-out;
            border-color: var(--primary-pink);
        }

        @keyframes pulseMusicBubble {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 101, 132, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 15px 35px rgba(255, 101, 132, 0.5); }
        }

        /* MAIN STAGE CONTAINER */
        #stage {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage-view {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stage-view.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* STATE 1: MẶC ĐỊNH / ✊ FIST - LÕI TRỌNG LỰC TÌNH YÊU */
        .gravity-core-wrap {
            position: relative;
            width: 280px;
            height: 280px;
            display: grid;
            place-items: center;
        }

        .gravity-orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(255, 101, 132, 0.35);
            animation: spinRing 12s linear infinite;
        }

        .ring-1 { width: 220px; height: 220px; }
        .ring-2 { width: 280px; height: 280px; animation-duration: 18s; animation-direction: reverse; }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .orbit-item {
            position: absolute;
            font-size: 20px;
            top: 50%;
            left: 50%;
            margin: -12px;
            filter: drop-shadow(0 2px 6px rgba(255, 101, 132, 0.4));
        }

        .orbit-item:nth-child(1) { transform: rotate(0deg) translate(110px) rotate(0deg); }
        .orbit-item:nth-child(2) { transform: rotate(72deg) translate(110px) rotate(-72deg); }
        .orbit-item:nth-child(3) { transform: rotate(144deg) translate(110px) rotate(-144deg); }
        .orbit-item:nth-child(4) { transform: rotate(216deg) translate(110px) rotate(-216deg); }
        .orbit-item:nth-child(5) { transform: rotate(288deg) translate(110px) rotate(-288deg); }

        .chibi-heart-core {
            position: relative;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #FF6584, #FF8DA1);
            border-radius: 35px;
            transform: rotate(-45deg);
            box-shadow: 0 15px 40px rgba(255, 101, 132, 0.45), inset 0 -6px 12px rgba(0,0,0,0.1);
            animation: squishyPulse 1.8s infinite ease-in-out;
            cursor: pointer;
        }

        .chibi-heart-core::before, .chibi-heart-core::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: inherit;
            border-radius: 50%;
        }

        .chibi-heart-core::before { top: -60px; left: 0; }
        .chibi-heart-core::after { left: 60px; top: 0; }

        .heart-face {
            position: absolute;
            top: 15px;
            left: 15px;
            transform: rotate(45deg);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }

        .heart-eyes {
            display: flex;
            gap: 28px;
            margin-top: 10px;
        }

        .heart-eye {
            width: 10px;
            height: 14px;
            background: #FFFFFF;
            border-radius: 50%;
            position: relative;
            animation: blinkEye 3.5s infinite;
        }

        .heart-eye::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4A3E4E;
            border-radius: 50%;
            top: 4px;
            left: 3px;
        }

        .heart-cheeks {
            display: flex;
            gap: 40px;
            margin-top: -4px;
        }

        .heart-cheek {
            width: 14px;
            height: 8px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        .heart-mouth {
            width: 12px;
            height: 6px;
            border-bottom: 3px solid #FFFFFF;
            border-radius: 0 0 10px 10px;
            margin-top: -2px;
        }

        @keyframes squishyPulse {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.12) rotate(-45deg); }
        }

        @keyframes blinkEye {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .core-caption-pill {
            margin-top: 36px;
            background: var(--card-bg);
            border: 2px solid rgba(255, 141, 161, 0.4);
            border-radius: 50px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-pink);
            box-shadow: var(--bubbly-shadow);
            animation: floatPill 2.5s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes floatPill {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* STATE 2: 🖐️ OPEN PALM - BUNG NHÂN VẬT CẦM HOA */
        .cat-flower-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .speech-bubble-cute {
            position: relative;
            background: var(--card-bg);
            border: 3px solid #FF8DA1;
            border-radius: 25px;
            padding: 12px 28px;
            font-size: 20px;
            font-weight: 800;
            color: #FF5376;
            box-shadow: var(--bubbly-shadow);
            margin-bottom: 20px;
            animation: bounceBubble 1.6s infinite ease-in-out;
        }

        .speech-bubble-cute::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 12px 0;
            border-style: solid;
            border-color: #FF8DA1 transparent;
            display: block;
            width: 0;
        }

        .speech-bubble-cute::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 9px 0;
            border-style: solid;
            border-color: #FFFFFF transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        @keyframes bounceBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.04); }
        }

        .cat-character-card {
            background: #FFFFFF;
            padding: 16px;
            border-radius: 36px;
            border: 4px solid #FFE0E6;
            box-shadow: 0 20px 48px rgba(255, 101, 132, 0.25);
            position: relative;
            animation: catFloating 2.8s infinite ease-in-out;
        }

        .cat-image-render {
            width: 270px;
            height: 270px;
            object-fit: contain;
            border-radius: 24px;
            display: block;
        }

        @keyframes catFloating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-2deg); }
            75% { transform: translateY(-5px) rotate(2deg); }
        }

        .flower-sparkle-fx {
            position: absolute;
            font-size: 24px;
            animation: sparkleSpin 2s infinite ease-in-out;
        }
        .fx-1 { top: -10px; right: -10px; }
        .fx-2 { bottom: 10px; left: -15px; animation-delay: 1s; }

        @keyframes sparkleSpin {
            0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        }

        /* STATE 3: ☝️ 1 NGÓN TAY - ALBUM 5 ẢNH & MÈO CẦM ĐIỆN THOẠI */
        .album-flow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 480px;
            width: 90%;
        }

        .photo-card-frame {
            position: relative;
            width: 300px;
            height: 340px;
            background: #FFFFFF;
            border-radius: 28px;
            padding: 14px 14px 48px;
            box-shadow: 0 18px 45px rgba(255, 101, 132, 0.22);
            border: 3px solid #FFE4E9;
            transform-origin: center bottom;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .photo-card-frame:hover {
            transform: scale(1.03) rotate(-1deg);
        }

        .photo-inner-img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            border-radius: 20px;
            background: #FFE8ED;
            display: block;
            transition: opacity 0.3s;
        }

        .photo-pin-cute {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 18px;
            background: rgba(255, 182, 193, 0.85);
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .photo-caption-text {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #FF5376;
            font-family: var(--font-sub);
        }

        .stepper-dots-cute {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD1DC;
            cursor: pointer;
            transition: all 0.25s;
        }

        .step-dot.active {
            background: var(--primary-pink);
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(255, 101, 132, 0.5);
        }

        .cat-phone-section {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .cat-phone-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            animation: phoneBob 2s infinite ease-in-out;
        }

        @keyframes phoneBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        .camera-flash-fx {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #FFFFFF 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .camera-flash-fx.flashing {
            animation: flashLight 0.6s ease-out;
        }

        @keyframes flashLight {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
        }

        .photo-nav-arrow {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 2px solid #FFD1DC;
            color: var(--primary-pink);
            font-size: 22px;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: var(--bubbly-shadow);
            transition: all 0.2s;
            z-index: 5;
        }

        .photo-nav-arrow:hover {
            transform: translateY(-50%) scale(1.15);
            background: var(--primary-pink);
            color: #FFFFFF;
        }

        .arrow-prev { left: -54px; }
        .arrow-next { right: -54px; }

        /* STATE 4: ✌️ 2 NGÓN TAY - ANH THÍCH EM LẮM NHA (PHÓNG TO & TÁCH NỀN HOÀN TOÀN) */
        .confession-love-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 700px;
            padding: 0 20px;
        }

        /* Phóng to nhân vật, tách nền không viền */
        .cat-standing-giant-wrap {
            position: relative;
            margin-bottom: 24px;
            display: grid;
            place-items: center;
        }

        .cat-standing-transparent-img {
            width: 360px;
            max-width: 85vw;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 15px 35px rgba(255, 101, 132, 0.35));
            animation: catHappyGiantWiggle 2.2s infinite ease-in-out;
        }

        @keyframes catHappyGiantWiggle {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-12px) rotate(-3.5deg) scale(1.03); }
            75% { transform: translateY(-12px) rotate(3.5deg) scale(1.03); }
        }

        .headline-love-bouncy {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.3;
            background: linear-gradient(135deg, #FF3366 0%, #FF6584 50%, #FF8DA1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 101, 132, 0.3);
            animation: textBounce 1.8s infinite ease-in-out;
        }

        @keyframes textBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .subline-love-cute {
            margin-top: 14px;
            font-size: 17px;
            font-weight: 600;
            color: #8C7A8F;
            font-family: var(--font-sub);
        }

        /* MINI CAMERA HUD IN CORNER */
        .camera-corner-bubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #FFFFFF;
            box-shadow: var(--bubbly-shadow);
            overflow: hidden;
            background: #FFD1DC;
            z-index: 90;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .camera-corner-bubble:hover {
            transform: scale(1.1);
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* MODAL: UPLOAD & QUẢN LÝ 5 ẢNH */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 62, 78, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 200;
            display: grid;
            place-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-cute-box {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
            border: 3px solid #FFE0E6;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal-cute-box {
            transform: scale(1);
        }

        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header-row h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-pink);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-modal {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #FFF0F3;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--primary-pink);
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            background: var(--primary-pink);
            color: #FFFFFF;
        }

        .photo-slot-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .photo-slot-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 18px;
            background: #FFF7F9;
            border: 1px solid #FFE0E6;
        }

        .slot-thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #FFD1DC;
        }

        .slot-info {
            flex: 1;
        }

        .slot-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
        }

        .slot-sub {
            font-size: 11px;
            color: var(--text-soft);
            font-family: var(--font-sub);
        }

        .btn-upload-file {
            background: var(--primary-pink);
            color: #FFFFFF;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-upload-file:hover {
            transform: scale(1.05);
            background: #FF5376;
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .headline-love-bouncy { font-size: 34px; }
            .cat-standing-transparent-img { width: 280px; }
            .cat-image-render { width: 220px; height: 220px; }
            .photo-card-frame { width: 260px; height: 300px; }
            .photo-inner-img { height: 230px; }
            .arrow-prev { left: -16px; }
            .arrow-next { right: -16px; }
            .camera-corner-bubble { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sky background decorations -->
    <div class="sky-decor">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
    </div>

    <!-- Hidden YouTube Audio Player -->
    <div id="ytContainer" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">
        <div id="ytPlayer"></div>
    </div>

    <!-- Top cute navigation: ONLY ICONS (No text) -->
    <nav class="cute-nav">
        <button class="btn-icon-bubble" id="btnOpenPhotosModal" title="Ảnh của chúng mình">
            🐾
        </button>

        <button class="btn-icon-bubble" id="btnMusicToggle" title="Bật/Tắt Nhạc">
            🎵
        </button>
    </nav>

    <!-- MAIN INTERACTIVE STAGE -->
    <main id="stage">

        <!-- STATE 1: MẶC ĐỊNH / ✊ FIST - LÕI TRỌNG LỰC TÌNH YÊU -->
        <section class="stage-view active" id="viewFist">
            <div class="gravity-core-wrap">
                <div class="gravity-orbit-ring ring-1">
                    <span class="orbit-item">💖</span>
                    <span class="orbit-item">✨</span>
                    <span class="orbit-item">🍬</span>
                    <span class="orbit-item">🌸</span>
                    <span class="orbit-item">⭐</span>
                </div>
                <div class="gravity-orbit-ring ring-2"></div>

                <div class="chibi-heart-core" id="chibiHeartCoreBtn" onclick="triggerPalmMode()">
                    <div class="heart-face">
                        <div class="heart-eyes">
                            <div class="heart-eye"></div>
                            <div class="heart-eye"></div>
                        </div>
                        <div class="heart-cheeks">
                            <div class="heart-cheek"></div>
                            <div class="heart-cheek"></div>
                        </div>
                        <div class="heart-mouth"></div>
                    </div>
                </div>
            </div>

            <div class="core-caption-pill" onclick="triggerPalmMode()">
                Lõi trọng lực tình yêu 💕
            </div>
        </section>

        <!-- STATE 2: 🖐️ OPEN PALM - BUNG NHÂN VẬT CẦM HOA -->
        <section class="stage-view" id="viewPalm">
            <div class="cat-flower-container">
                <div class="speech-bubble-cute">
                    Cho nèee~ 🌸
                </div>

                <div class="cat-character-card">
                    <span class="flower-sparkle-fx fx-1">✨</span>
                    <span class="flower-sparkle-fx fx-2">💖</span>
                    <img class="cat-image-render" id="catFlowerImg" src="assets/cat_flower.jpg" alt="Mèo cầm hoa">
                </div>
            </div>
        </section>

        <!-- STATE 3: ☝️ 1 NGÓN TAY - ALBUM 5 ẢNH & MÈO CẦM ĐIỆN THOẠI -->
        <section class="stage-view" id="viewPoint">
            <div class="album-flow-container">
                <div style="position: relative;">
                    <button class="photo-nav-arrow arrow-prev" onclick="prevPhoto()">‹</button>
                    <button class="photo-nav-arrow arrow-next" onclick="nextPhoto()">›</button>

                    <div class="photo-card-frame" id="photoFrame" onclick="nextPhoto()">
                        <div class="photo-pin-cute"></div>
                        <img class="photo-inner-img" id="currentPhotoImg" src="" alt="Kỷ niệm">
                        <div class="photo-caption-text" id="photoCaption">Khoảnh Khắc 1 / 5 💕</div>
                    </div>
                </div>

                <!-- 5 dots stepper -->
                <div class="stepper-dots-cute" id="stepperDots">
                    <div class="step-dot active" onclick="goToPhoto(0)"></div>
                    <div class="step-dot" onclick="goToPhoto(1)"></div>
                    <div class="step-dot" onclick="goToPhoto(2)"></div>
                    <div class="step-dot" onclick="goToPhoto(3)"></div>
                    <div class="step-dot" onclick="goToPhoto(4)"></div>
                </div>

                <!-- Cat holding phone taking picture -->
                <div class="cat-phone-section">
                    <div class="camera-flash-fx" id="cameraFlash"></div>
                    <img class="cat-phone-img" id="catPhoneImg" src="assets/cat_phone.jpg" alt="Mèo cầm điện thoại">
                </div>
            </div>
        </section>

        <!-- STATE 4: ✌️ 2 NGÓN TAY - ANH THÍCH EM LẮM NHA (PHÓNG TO & TÁCH NỀN) -->
        <section class="stage-view" id="viewPeace">
            <div class="confession-love-container">
                <div class="cat-standing-giant-wrap">
                    <img class="cat-standing-transparent-img" id="catStandingImg" src="assets/cat_standing_transparent.png" alt="Mèo đứng dễ thương">
                </div>

                <h1 class="headline-love-bouncy">
                    Anh Thích Em Lắm Nha 💕
                </h1>
                <p class="subline-love-cute">
                    Mỗi ngày trôi qua đều thích em nhiều hơn một chút ✨
                </p>
            </div>
        </section>

    </main>

    <!-- MINI CAMERA HUD -->
    <div class="camera-corner-bubble" id="cameraBubble" title="AI Camera nhận diện cử chỉ">
        <video id="cameraFeed" playsinline autoplay muted></video>
    </div>

    <!-- MODAL QUẢN LÝ 5 ẢNH -->
    <div class="modal-overlay" id="photosModal">
        <div class="modal-cute-box">
            <div class="modal-header-row">
                <h3>🐾 5 Tấm Ảnh Của Tụi Mình</h3>
                <button class="btn-close-modal" id="btnCloseModal">✕</button>
            </div>
            <div class="photo-slot-grid" id="photoSlotsContainer">

            <p style="margin-top: 14px; font-size: 11px; text-align: center; color: var(--text-soft); font-family: var(--font-sub);">
                Ảnh được lưu an toàn trên trình duyệt của bạn 💕
            </p>
        </div>
    </div>

    <!-- YOUTUBE API LOADER & CONTROLLER -->
    <script>
        let ytPlayer = null;
        let isYtReady = false;
        let isMusicPlaying = false;

        // Load YouTube Iframe API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayer', {
                height: '1',
                width: '1',
                videoId: 'JSNx1YnMbDk',
                playerVars: {
                    'start': 26,
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'JSNx1YnMbDk',
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isYtReady = true;
            console.log('YouTube API Ready!');
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                updateMusicButtonUI(true);
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isMusicPlaying = false;
                updateMusicButtonUI(false);
            }
        }

        function playCuteMusic() {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                try {
                    ytPlayer.seekTo(26, true);
                    ytPlayer.playVideo();
                    isMusicPlaying = true;
                    updateMusicButtonUI(true);
                } catch(e) {
                    console.log('YT play blocked:', e);
                }
            }
        }

        function toggleMusic() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
            if (isMusicPlaying) {
                ytPlayer.pauseVideo();
                isMusicPlaying = false;
                updateMusicButtonUI(false);
            } else {
                ytPlayer.seekTo(26, true);
                ytPlayer.playVideo();
                isMusicPlaying = true;
                updateMusicButtonUI(true);
            }
        }

        function updateMusicButtonUI(playing) {
            const btn = document.getElementById('btnMusicToggle');
            btn.classList.toggle('playing', playing);
            btn.textContent = playing ? '🎶' : '🎵';
        }

        document.getElementById('btnMusicToggle').addEventListener('click', toggleMusic);
    </script>

    <!-- PHOTO ALBUM & LOCALSTORAGE MANAGEMENT -->
    <script>
        const DEFAULT_PHOTOS = [
            "https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=900&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?q=80&w=900&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=900&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=900&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=900&auto=format&fit=crop"
        ];

        let userPhotos = [];
        try {
            const saved = localStorage.getItem('user_cute_photos');
            if (saved) userPhotos = JSON.parse(saved);
        } catch(e){}

        if (!Array.isArray(userPhotos) || userPhotos.length !== 5) {
            userPhotos = [...DEFAULT_PHOTOS];
        }

        let currentPhotoIdx = 0;

        function updatePhotoDisplay() {
            const img = document.getElementById('currentPhotoImg');
            const caption = document.getElementById('photoCaption');
            const dots = document.querySelectorAll('.step-dot');

            img.style.opacity = '0.3';
            setTimeout(() => {
                img.src = userPhotos[currentPhotoIdx];
                caption.textContent = `Khoảnh Khắc ${currentPhotoIdx + 1} / 5 💕`;
                img.style.opacity = '1';
            }, 120);

            dots.forEach((d, i) => d.classList.toggle('active', i === currentPhotoIdx));

            // Trigger cat phone camera flash
            const flash = document.getElementById('cameraFlash');
            flash.classList.remove('flashing');
            void flash.offsetWidth;
            flash.classList.add('flashing');
        }

        function nextPhoto() {
            currentPhotoIdx = (currentPhotoIdx + 1) % 5;
            updatePhotoDisplay();
        }

        function prevPhoto() {
            currentPhotoIdx = (currentPhotoIdx - 1 + 5) % 5;
            updatePhotoDisplay();
        }

        function goToPhoto(idx) {
            currentPhotoIdx = idx;
            updatePhotoDisplay();
        }

        updatePhotoDisplay();

        // Render Photo Slots in Modal
        const slotsContainer = document.getElementById('photoSlotsContainer');
        function renderPhotoSlots() {
            slotsContainer.innerHTML = '';
            userPhotos.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = 'photo-slot-item';
                item.innerHTML = `
                    <img class="slot-thumb" src="${src}" alt="Ảnh ${idx + 1}">
                    <div class="slot-info">
                        <div class="slot-title">Ảnh số ${idx + 1}</div>
                        <div class="slot-sub">Kỷ niệm đáng nhớ</div>
                    </div>
                    <label class="btn-upload-file">
                        Thay Ảnh
                        <input type="file" accept="image/*" style="display:none" onchange="handleUploadPhoto(event, ${idx})">
                    </label>
                `;
                slotsContainer.appendChild(item);
            });
        }

        window.handleUploadPhoto = function(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                userPhotos[idx] = evt.target.result;
                try {
                    localStorage.setItem('user_cute_photos', JSON.stringify(userPhotos));
                } catch(e){}
                renderPhotoSlots();
                updatePhotoDisplay();
            };
            reader.readAsDataURL(file);
        };

        // Modal Open / Close
        const modal = document.getElementById('photosModal');
        document.getElementById('btnOpenPhotosModal').addEventListener('click', () => {
            renderPhotoSlots();
            modal.classList.add('open');
        });
        document.getElementById('btnCloseModal').addEventListener('click', () => {
            modal.classList.remove('open');
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('open');
        });
    </script>

    <!-- STATE MACHINE & GESTURE CONTROLS -->
    <script>
        const views = {
            fist: document.getElementById('viewFist'),
            palm: document.getElementById('viewPalm'),
            point: document.getElementById('viewPoint'),
            peace: document.getElementById('viewPeace')
        };

        function resetAllViews() {
            Object.values(views).forEach(v => v.classList.remove('active'));
        }

        // ✊ FIST: LÕI TRỌNG LỰC TÌNH YÊU
        window.triggerFistMode = function() {
            resetAllViews();
            views.fist.classList.add('active');
        };

        // 🖐️ OPEN PALM: MÈO CẦM HOA & PHÁT NHẠC
        window.triggerPalmMode = function() {
            resetAllViews();
            views.palm.classList.add('active');
            playCuteMusic();
            burstFloatingHearts(12);
        };

        // ☝️ POINT: ALBUM 5 ẢNH & MÈO CẦM ĐIỆN THOẠI
        window.triggerPointMode = function() {
            resetAllViews();
            views.point.classList.add('active');
        };

        // ✌️ PEACE: ANH THÍCH EM LẮM NHA (PHÓNG TO & TÁCH NỀN)
        window.triggerPeaceMode = function() {
            resetAllViews();
            views.peace.classList.add('active');
            burstFloatingHearts(25);
        };

        // Burst floating hearts animation
        function burstFloatingHearts(count = 10) {
            const emojis = ['💖', '💕', '🌸', '✨', '🍓', '🍬'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart-item';
                    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = (Math.random() * 85 + 5) + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 4) + 's';
                    heart.style.fontSize = (Math.random() * 16 + 20) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 6000);
                }, i * 150);
            }
        }

        // Ambient heart spawner
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart-item';
            heart.textContent = ['🌸', '✨', '💖'][Math.floor(Math.random() * 3)];
            heart.style.left = (Math.random() * 90 + 5) + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }, 1800);
    </script>

    <!-- MEDIAPIPE AI CAMERA GESTURE RECOGNITION -->
    <script>
        const videoElement = document.getElementById('cameraFeed');
        let currentGesture = null;
        let gestureDebounce = 0;
        let lastIndexX = null;
        let swipeDebounce = 0;

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                lastIndexX = null;
                return;
            }

            const lm = results.multiHandLandmarks[0];
            const indexTip = lm[8];

            // Check gestures
            const isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
            const isOpenPalm = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y && lm[20].y < lm[18].y;
            const isPeace = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
            const isPoint = lm[8].y < lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;

            const now = Date.now();

            // Swipe detection when in Point mode (đưa tay qua lại để chuyển ảnh)
            if (isPoint && views.point.classList.contains('active')) {
                const currentX = 1 - indexTip.x; // mirrored
                if (lastIndexX !== null && now - swipeDebounce > 500) {
                    const deltaX = currentX - lastIndexX;
                    if (deltaX > 0.12) {
                        nextPhoto();
                        swipeDebounce = now;
                    } else if (deltaX < -0.12) {
                        prevPhoto();
                        swipeDebounce = now;
                    }
                }
                lastIndexX = currentX;
            } else {
                lastIndexX = null;
            }

            if (now - gestureDebounce < 800) return;

            if (isPeace) {
                if (currentGesture !== 'PEACE') {
                    currentGesture = 'PEACE';
                    gestureDebounce = now;
                    triggerPeaceMode();
                }
            } else if (isFist) {
                if (currentGesture !== 'FIST') {
                    currentGesture = 'FIST';
                    gestureDebounce = now;
                    triggerFistMode();
                }
            } else if (isOpenPalm) {
                if (currentGesture !== 'PALM') {
                    currentGesture = 'PALM';
                    gestureDebounce = now;
                    triggerPalmMode();
                }
            } else if (isPoint) {
                if (currentGesture !== 'POINT') {
                    currentGesture = 'POINT';
                    gestureDebounce = now;
                    triggerPointMode();
                }
            }
        }

        // Initialize camera
        function initAiCamera() {
            if (typeof Hands !== 'undefined' && typeof Camera !== 'undefined') {
                try {
                    const hands = new Hands({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                    });

                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.65,
                        minTrackingConfidence: 0.65
                    });

                    hands.onResults(onResults);

                    const camera = new Camera(videoElement, {
                        onFrame: async () => {
                            if (videoElement.videoWidth > 0) {
                                await hands.send({ image: videoElement });
                            }
                        },
                        width: 320,
                        height: 240
                    });

                    camera.start().catch((err) => {
                        console.log('Camera start fallback:', err);
                    });
                } catch(e) {
                    console.log('MediaPipe init exception:', e);
                }
            }
        }

        // Click on camera bubble to toggle camera
        document.getElementById('cameraBubble').addEventListener('click', initAiCamera);

        // Auto request camera after gentle delay
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.permissions && navigator.permissions.query({ name: 'camera' }).then(res => {
                if (res.state === 'granted') initAiCamera();
            }).catch(() => {});
        }
    </script>
